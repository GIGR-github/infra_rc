# ==============================================================================
# DEPLOYMENT MANIFEST: Infrastructure & Swarm Topology (RedCoast Core Infra)
# TARGET ENVIRONMENT: UAT / Production (Docker Swarm Cluster)
# METADATA:           Ticket:   [JIRA-4021] Infrastructure Setup & Cluster Bootstrap
#                     Date:     2026-07-03
#                     Author:   Pavel P. <ppanbeing@redcoast.com>
# ==============================================================================
# DESCRIPTION:
#   Bootstraps the core Docker Swarm cluster topology across heterogeneous nodes.
#   Configures node placement labels, provisions isolated overlay networks,
#   injects runtime secrets via standard input streams, and deploys the
#   underlying database infrastructure stack without local disk state exposure.
# ==============================================================================
- name: "Infrastructure: Install Docker Engine on cluster nodes"
  hosts: cluster
  become: true
  tasks:
    - name: Import Docker install script
      ansible.builtin.import_tasks: tasks/install-docker.yml

- name: "Swarm Core: Initialize Cluster Manager"
  hosts: managers
  become: true
  tasks:
    - name: Import Swarm init script
      ansible.builtin.import_tasks: tasks/init-swarm.yml

- name: "Swarm Core: Join Workers to cluster topology"
  hosts: workers
  become: true
  tasks:
    - name: Import Swarm joint workers script
      ansible.builtin.import_tasks: tasks/join-workers.yml

- name: "Swarm Core: Assigning labels to nodes"
  hosts: managers
  become: true
  tasks:
    - name: Import assign workers's label script
      ansible.builtin.import_tasks: tasks/assign-labels.yml

- name: "Infrastructure: Create Docker Network"
  hosts: managers
  become: true
  tasks:
    - name: Import create docker network script
      ansible.builtin.import_tasks: tasks/create-network.yml

- name: "Infrastructure: Deploy infra services"
  hosts: managers
  become: true
  vars:
    infra_src_dir: "./manifests/"
    infra_dest_dir: "/home/ubuntu/app/infra"
    db_password: "{{ lookup('ansible.builtin.env', 'DB_PASSWORD') }}"
    db_root_password: "{{ lookup('ansible.builtin.env', 'DB_ROOT_PASSWORD') }}"
    flyway_password: "{{ lookup('ansible.builtin.env', 'FLYWAY_PASSWORD') }}"
  tasks:
    - name: Import deploy infra script
      ansible.builtin.import_tasks: tasks/deploy-infra.yml