name: "Template: Infra deploy"
on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_env }}
  cancel-in-progress: false
jobs:
  base-deploy:
    name: "Deploy infra to [${{ inputs.target_env }}]"
    runs-on: self-hosted
    environment: ${{ inputs.target_env }}
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      TARGET_ENV_TF: ${{ vars.TARGET_ENV_TF }}
    steps:
      - name: Global ff checklist
        #language=bash
        run: |
          if [ -z "${{ secrets.SSH_PUBLIC_KEY }}" ]; then echo "ERROR: SSH_PUBLIC_KEY is missing"; exit 1; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "ERROR: SSH_PRIVATE_KEY is missing"; exit 1; fi
          if [ -z "${{ secrets.PERSONAL_VAR_TOKEN }}" ]; then echo "ERROR: PERSONAL_VAR_TOKEN PAT is missing"; exit 1; fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ] || [ -z "${{ secrets.DB_ROOT_PASSWORD }}" ] || [ -z "${{ secrets.FLYWAY_PASSWORD }}" ]; then
            echo "ERROR: Critical database variables are missing"
            exit 1
          fi
          ../scripts/ff-checklist.sh
        

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3

      - name: Deploy infra env
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: ../scripts/deploy-infra.sh

      - name: Get manager ip-address and update app repo variable
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_VAR_TOKEN }}
        run: ../scripts/get-ip-manager.sh

      - name: Install ssh key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_ed25519
          known_hosts: " "
          if_key_exists: replace

      - name: Run ansible playbook
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
        run: |
          ansible-playbook -i ./inventory/nodes.ini ../infra-cluster-setup.yml
          echo "SUCCESS: Infra setup is deployed"

      - name: Clean infra on failure
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        if: failure()
        run: ../scripts/rollback.sh