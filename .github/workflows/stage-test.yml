name: "Infrastructure CI/CD"
env:
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  GH_TOKEN: ${{ secrets.PERSONAL_VAR_TOKEN }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
  FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          # Запуск при создании тега (например, v1.0.0)
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      job_to_run:
        description: "Select a job to run"
        required: true
        default: 'ALL'
        type: choice
        options:
          - STAGING
          - PROD
permissions:
  actions: write
  contents: read
  pull-requests: write      # Чтобы бот мог писать вывод plan в комменты PR
jobs:
  # ==========================================
  # 1. ПРОВЕРКА И ПЛАН ДЛЯ STAGING (Pull Request)
  # ==========================================
#  validate-requirements:
#    name: "Validation: Requirements"
#    runs-on: self-hosted
#    steps:
#      - name: GLOBAL FF CHECKLIST
#        # language=bash
#        run: ./scripts/ff-checklist.sh
  staging-plan:
    name: "Staging: Validate & Plan"
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: CHECKOUT CODE
        uses: actions/checkout@v4
        with:
          clean: true

      - name: SETUP TERRAFORM
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: INIT
        run: terraform init
        env:
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}

      - name: VALIDATE & FORMAT
        run: |
          terraform fmt -check
          terraform validate

      - name: TERRAFORM PLAN (STAGING)
        id: plan
        run: terraform plan -var-file="staging.tfvars" -no-color
        env:
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
  staging-apply:
    name: "Staging: Apply"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || (github.event.inputs.job_to_run == 'STAGING')
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./terraform
    env:
      TARGET_ENV_TF: "staging.tfvars"
    steps:
      - name: CHECKOUT CODE
        uses: actions/checkout@v4
        with:
          clean: true

      - name: GLOBAL FF CHECKLIST
        run: ../scripts/ff-checklist.sh

      - name: SETUP TERRAFORM
        uses: hashicorp/setup-terraform@v3

      - name: DEPLOY INFRA ENV
        env:
          TF_VAR_ssh_public_key: $SSH_PUBLIC_KEY
        run: ../scripts/deploy-infra.sh

      - name: GET MANAGER IP-ADDRESS AND UPDATE APP REPO VARIABLE
        run: ../scripts/get-ip-manager.sh

      - name: INSTALL SSH KEY
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          name: id_ed25519
          known_hosts: " "
          if_key_exists: replace
      - name: RUN ANSIBLE PLAYBOOK
        run: |
          ansible-playbook -i ./inventory/nodes.ini ../infra-cluster-setup.yml
          echo "SUCCESS: Infra setup is deployed"

      - name: CLEAN INFRA ON FAILURE
        if: failure()
        env:
          TF_VAR_ssh_public_key: $SSH_PUBLIC_KEY
        run: ../scripts/rollback.sh
  # ==========================================
  # 3. ДЕПЛОЙ НА PRODUCTION (По релизному тегу v*)
  # ==========================================
  prod-apply:
    name: "Production: Apply"
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.job_to_run == 'PROD'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./terraform
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply (Prod)
        run: terraform apply -var-file="prod.tfvars" -auto-approve
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}