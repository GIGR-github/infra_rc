name: "Infrastructure CI/CD"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          # Запуск при создании тега (например, v1.0.0)
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # Возможность ручного запуска из интерфейса

permissions:
  contents: read
  pull-requests: write      # Чтобы бот мог писать вывод plan в комменты PR

jobs:
  # ==========================================
  # 1. ПРОВЕРКА И ПЛАН ДЛЯ STAGING (Pull Request)
  # ==========================================
  staging-plan:
    name: "Staging: Validate & Plan"
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Init
        run: terraform init
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Validate & Format
        run: |
          terraform fmt -check
          terraform validate

      - name: Terraform Plan (Staging)
        id: plan
        run: terraform plan -var-file="staging.tfvars" -no-color
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

  # ==========================================
  # 2. АВТО-ДЕПЛОЙ НА STAGING (После мёрджа в main)
  # ==========================================
  staging-apply:
    name: "Staging: Apply"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply (Staging)
        run: terraform apply -var-file="staging.tfvars" -auto-approve
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Get IP and Update App Repo Variable
        env:
          # Для обновления переменной В ЭТОМ ЖЕ репозитории достаточно встроенного токена!
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_IP=$(terraform output -raw swarm_manager_ip)

          echo "Получен IP менеджер-ноды: $MANAGER_IP"
          gh variable set SWARM_MANAGER_IP --body "$MANAGER_IP" --repo "${{ github.repository }}"

#      - name: Run Ansible Playbook
#        env:
#          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
#          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
#          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
#        run: |
#          ansible-playbook -i ./inventory/nodes.ini ../infra-cluster-setup.yml


  # ==========================================
  # 3. ДЕПЛОЙ НА PRODUCTION (По релизному тегу v*)
  # ==========================================
  prod-apply:
    name: "Production: Apply"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./terraform
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply (Prod)
        run: terraform apply -var-file="prod.tfvars" -auto-approve
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}