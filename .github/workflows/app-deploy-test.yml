name: Manual Test App Deployment

on:
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Verify Swarm Manager IP
        run: |
          echo "=== РУЧНОЙ ТЕСТ ПАЙПЛАЙНА ПРИЛОЖЕНИЯ ==="
          echo "Забираем последний сохраненный IP-адрес из настроек репозитория..."
          echo "Текущий IP для деплоя: ${{ vars.SWARM_MANAGER_IP }}"
      - name: Prepare env file
        run: |
          echo "db_password=${{ secrets.DB_PASSWORD }}" >> manifests/.env.uat

      - name: Copy files via native SCP
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET_HOST: ${{ vars.SWARM_MANAGER_IP }}
        run: |
          cat << 'EOF' > private_key.pem
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 private_key.pem

          # Добавляем -o BatchMode=yes, чтобы SSH не зависал в ожидании пароля ключа
          ssh -i private_key.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 ubuntu@$TARGET_HOST "mkdir -p /home/ubuntu/apps/my-app/"

          scp -i private_key.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 manifests/docker-compose.app.yml ubuntu@$TARGET_HOST:/home/ubuntu/apps/my-app/
          scp -i private_key.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 manifests/.env.uat ubuntu@$TARGET_HOST:/home/ubuntu/apps/my-app/

          rm -f private_key.pem

      - name: Deploy App to Swarm via Native SSH
        env:
          TARGET_HOST: ${{ vars.SWARM_MANAGER_IP }}
        run: |
          echo "=== ЗАПУСК ДЕПЛОЯ ЧЕРЕЗ SSH ==="
          
          # 1. Записываем приватный SSH-ключ во временный файл без искажения строк
          cat << 'EOF' > private_key.pem
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 private_key.pem

          # 2. Подключаемся по SSH и выполняем всю логику деплоя одной командой
          # Флаг -T отключает запрос интерактивного терминала tty (чтобы не было зависаний)
          ssh -i private_key.pem -o StrictHostKeyChecking=no -T ubuntu@$TARGET_HOST << 'SSH_EOF'
            cd /home/ubuntu/apps/my-app
          
            # Переименовываем конфигурационный файл
            cp .env.uat .env
          
            # Безопасно создаем Docker Secret, если его еще нет в Swarm
            if ! docker secret inspect db_password >/dev/null 2>&1; then
              echo "Создаем Docker Secret db_password..."
              export $(grep -v "^#" .env | xargs)
              echo "$db_password" | docker secret create db_password -
            fi
          
            # Разворачиваем стек приложения
            docker stack deploy -c docker-compose.app.yml my-app
          SSH_EOF

          # 3. Подчищаем временный ключ на вашем Макбуке
          rm -f private_key.pem
          echo "=== ДЕПЛОЙ УСПЕШНО ЗАВЕРШЕН ==="
