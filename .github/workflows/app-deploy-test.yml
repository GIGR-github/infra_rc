name: Manual Test App Deployment

on:
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Verify Swarm Manager IP
        run: |
          echo "=== РУЧНОЙ ТЕСТ ПАЙПЛАЙНА ПРИЛОЖЕНИЯ ==="
          echo "Забираем последний сохраненный IP-адрес из настроек репозитория..."
          echo "Текущий IP для деплоя: ${{ vars.SWARM_MANAGER_IP }}"
      - name: Prepare env file
        run: |
          echo "db_password=${{ secrets.DB_PASSWORD }}" >> manifests/.env.uat


      - name: Copy files and deploy via Ansible ad-hoc command (using IP directly)
        env:
          # Забираем динамический IP-адрес из переменной репозитория
          TARGET_HOST: ${{ vars.SWARM_MANAGER_IP }}
        run: |
          echo "=== ЗАПУСК ДЕПЛОЯ ЧЕРЕЗ ANSIBLE ==="
          
          # 1. Записываем приватный SSH-ключ во временный файл
          cat << 'EOF' > private_key.pem
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 private_key.pem

          # 2. Копируем файлы manifests/ на сервер напрямую по IP-адресу.
          # ОБРАТИТЕ ВНИМАНИЕ на запятую после $TARGET_HOST! Это критически важно.
          ansible all -i "$TARGET_HOST," \
            --user=ubuntu \
            --private-key=private_key.pem \
            --ssh-common-args="-o StrictHostKeyChecking=no" \
            -m ansible.builtin.copy \
            -a "src=manifests/ dest=/home/ubuntu/apps/my-app/"

          # 3. Переименовываем .env.uat в .env внутри вашей виртуалки
          ansible all -i "$TARGET_HOST," \
            --user=ubuntu \
            --private-key=private_key.pem \
            --ssh-common-args="-o StrictHostKeyChecking=no" \
            -m ansible.builtin.shell \
            -a "cp /home/ubuntu/apps/my-app/manifests/.env.uat /home/ubuntu/apps/my-app/.env"

          # 4. Запускаем деплой стека в Docker Swarm
          ansible all -i "$TARGET_HOST," \
            --user=ubuntu \
            --private-key=private_key.pem \
            --ssh-common-args="-o StrictHostKeyChecking=no" \
            -m ansible.builtin.shell \
            -a "cd /home/ubuntu/apps/my-app && docker stack deploy -c manifests/docker-compose.app.yml my-app"

          # 5. Подчищаем временный ключ на вашем Макбуке
          rm -f private_key.pem
          echo "=== ДЕПЛОЙ УСПЕШНО ЗАВЕРШЕН ==="




