# ==============================================================================
# WORKFLOW       : Manual Test App Deployment
# DESCRIPTION    : Deploys a test version of the application to a Docker Swarm cluster (UAT).
#                  Includes network validation, secure configuration generation,
#                  dynamic secret rotation, and automated disk cleanup.
# ------------------------------------------------------------------------------
# AUTHOR         : Pavel Pan, ppanbeing@gmail.com
# DEPARTMENT     : DevOps & Infrastructure Engineering
# OWNER          : Infrastructure Team (Slack-channel: #devops-alerts)
# ------------------------------------------------------------------------------
# TARGET ENV     : UAT (User Acceptance Testing)
# PLATFORM       : Docker Swarm (Ubuntu 22.04 LTS Nodes)
# RUNS ON        : self-hosted (Internal corporate runners in a private network)
# TRIGGER        : Manual trigger (workflow_dispatch) via the GitHub Actions interface
# ------------------------------------------------------------------------------
# REVISION HISTORY:
#   2026-05-12 | v1.0 | @author   | Base inline pipeline version (legacy scp/ssh)
# ------------------------------------------------------------------------------
# REQUIRED REPOSITORY VARIABLES:
#   - vars.SWARM_MANAGER_IP   : IP address of the Docker Swarm cluster leader manager
#
# REQUIRED REPOSITORY SECRETS:
#   - secrets.DB_PASSWORD     : Master database password for generating .env.uat
#   - secrets.SSH_PRIVATE_KEY : Private key (RSA/ED25519) for SSH access to Swarm
# ==============================================================================
name: Manual Test App Deployment
env:
  SWARM_HOST_IP: ${{ vars.SWARM_MANAGER_IP }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  REMOTE_USER: ubuntu
  REMOTE_DIR: /home/ubuntu/apps/rc-app/
  SSH_KNOWN_HOST: ./tmp_known_host
on:
  workflow_dispatch:
jobs:
  deploy-test:
    runs-on: self-hosted
    steps:
      - name: CHECK LIST REQUIREMENTS
        # language=bash
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: <secrets.DB_PASSWORD> secret is missing"
            exit 1
          fi
          if [ -z "$SWARM_HOST_IP" ]; then
            echo "ERROR: <vars.SWARM_MANAGER_IP> secret is missing"
            exit 1
          fi 
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: <secrets.SSH_PRIVATE_KEY> secret is missing"
            exit 1
          fi
          echo "SUCCESS: All configuration variables and secrets are validated"
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: VERIFY SWARM MANAGER IP
        # language=bash
        run: |
          echo "Current manager IP-address for deploy: $SWARM_HOST_IP"
          echo "Sending ICMP-package to check network"
          if ping -c 3 "$SWARM_HOST_IP"; then
            echo "SUCCESS: Swarm Manager responded to the ping"
          else
            echo "ERROR: Swarm Manager is not responding!"
            exit 1
          fi
      - name: PREPARE ENV FILE
        # language=bash
        run: |
          ENV_PATH="manifests/.env.uat"
          echo "::group::Check for existence of the <$ENV_PATH> file"
          if [ ! -f "$ENV_PATH" ]; then
            echo "ERROR: $ENV_PATH is not exists"
            echo "::endgroup::"
            exit 1
          fi
          echo "SUCCESS: Configuration file found"
          echo "::endgroup::"
          echo "::group::Injecting credentials into $ENV_PATH"
          perl -i -pe 's/^db_password=.*//g' "$ENV_PATH"
          echo "db_password=$DB_PASSWORD" >> "$ENV_PATH"
          echo "SUCCESS: Credentials are injected"
          echo "::endgroup::"
      - name: INSTALL SSH KEY
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          name: id_ed25519
          known_hosts: " "
          if_key_exists: replace
      - name: SCAN KNOWN HOSTS
        # language=bash
        run: |
          echo "::group::Add remote host to isolated <know_hosts> file"
          touch "$SSH_KNOWN_HOST"
          ssh-keyscan -H "$SWARM_HOST_IP" >> "$SSH_KNOWN_HOST"
          if [ ! -s "$SSH_KNOWN_HOST" ]; then
            echo "ERROR: Failed to add remote host"
            echo "::endgroup::"
            exit 1
          fi
          echo "SUCCESS: remote host was added"
          echo "::endgroup::"
      - name: COPY FILES VIA NATIVE SCP
        # language=bash
        run: |
          echo "::group::Creating the application folder on the server"
          SSH_OPTS="-o UserKnownHostsFile=$SSH_KNOWN_HOST -o BatchMode=yes -o ConnectTimeout=10"
          echo "Create remote folder: $REMOTE_DIR"
          ssh $SSH_OPTS  "$REMOTE_USER@$SWARM_HOST_IP" "mkdir -p $REMOTE_DIR"
          echo "SUCCESS: Remote folder is created"
          echo "::endgroup::"
          echo "::group::Copy infra files of the deploying"
          echo "Copy docker-compose.app.yml and .env.uat files to the $REMOTE_DIR"
          scp $SSH_OPTS manifests/docker-compose.app.yml manifests/.env.uat "$REMOTE_USER@$SWARM_HOST_IP:$REMOTE_DIR"
          echo "SUCCESS: All files are copied"
          echo "::endgroup::"
      - name: DEPLOY APP TO SWARM VIA SSH
        # language=bash
        run: |
          SSH_OPTS="-o UserKnownHostsFile=$SSH_KNOWN_HOST -o BatchMode=yes -o ConnectTimeout=10"
          ssh $SSH_OPTS "$REMOTE_USER@$SWARM_HOST_IP" << SSH_EOF
            set -euo pipefail
            set -x
            cd $REMOTE_DIR
            cp .env.uat .env
            if ! docker secret inspect db_password >/dev/null 2>&1; then
              echo "Creating Docker Secret db_password..."
              export $(grep -v "^#" .env | xargs)
              echo "\$db_password" | docker secret create db_password -
            fi
            docker stack deploy -c docker-compose.app.yml my-app
            docker system prune -f
            set +x
          SSH_EOF
          echo "SUCCESS: Application is deployed in the cluster"