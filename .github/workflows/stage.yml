name: "Orchestrator: Infra multi-env deploy"
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      job_to_run:
        description: "Select a job to run"
        required: true
        default: 'STAGING'
        type: choice
        options:
          - STAGING
          - PROD
permissions:
  actions: write
  contents: read
  pull-requests: write      # Чтобы бот мог писать вывод plan в комменты PR
jobs:
  staging-apply:
    name: "STAGING"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || (github.event.inputs.job_to_run == 'STAGING')
    uses: ./.github/workflows/_deploy-infra.yml
    with:
      target_env: "STAGING"
      target_env_tf: "staging.tfvars"
    secrets:
      inherit
