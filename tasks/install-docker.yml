- name: Wait for any background apt locks to release
  # Этот шаг принудительно заставит Ansible подождать до 5 минут,
  # если Multipass в этот момент проводит фоновые обновления системы.
  ansible.builtin.apt:
    update_cache: yes
  register: apt_result
  until: apt_result is success
  retries: 30
  delay: 10

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - gnupg
    state: present

- name: Add Docker official GPG key
  ansible.builtin.apt_key:
    url: https://docker.com
    state: present

- name: Add Docker repository to apt sources
  ansible.builtin.apt_repository:
    repo: "deb [arch=arm64] https://docker.com {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Install Docker Engine packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is running and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
